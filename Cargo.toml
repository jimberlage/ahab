[package]
name = "ahab"
version = "4.0.0"
edition = "2021"
authors = ["Jim Berlage <jamesberlage@gmail.com>"]
description = "Aha Butler - A CLI helper for generating Aha tickets from plain text"
license = "MIT"

[[bin]]
name = "ahab"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.36", features = ["full", "sync"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# Markdown processing
pulldown-cmark = "0.9"
html2md = "0.2"

# Interactive prompts
dialoguer = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# HTTP mocking for tests
mockito = "1.2"
tempfile = "3.9"
pretty_assertions = "1.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
